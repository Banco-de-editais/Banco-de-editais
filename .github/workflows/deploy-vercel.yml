name: Deploy to Vercel

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
            node-version: 'lts/*'
            cache: 'npm'

      - name: Install Vercel CLI
        # Keep CI on the CLI version validated against this project.
        run: npm install --global vercel@54.10.3

      - name: Link Vercel project
        run: |
          vercel link \
            --yes \
            --team=diogo-s-projects-escopo \
            --project=banco-de-editais \
            --token=${{ secrets.VERCEL_TOKEN }}

      - name: Pull Vercel configuration
        run: |
          vercel pull \
            --yes \
            --environment=production \
            --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build
        run: |
          vercel build \
            --prod \
            --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy
        run: |
          vercel deploy \
            --prebuilt \
            --prod \
            --token=${{ secrets.VERCEL_TOKEN }}
